[package]
name = "youtube-chat-rs"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/efekrskl/youtube-chat-rs"
homepage = "https://github.com/efekrskl/youtube-chat-rs"
description = "YouTube chat in the terminal."

[[bin]]
name = "ytc"
path = "src/main.rs"

[package.metadata.dist]
formula = "ytc"

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.19"
reqwest = "0.13.2"
tonic = { version = "0.14.5", features = ["_tls-any", "tls-native-roots"] }
yup-oauth2 = "12.1.2"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
dialoguer = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14.3"
tonic-prost = "0.14.5"
rustls = { version = "0.23", features = ["ring"] }
env_logger = "0.11.9"
log = "0.4.29"
ratatui = "0.30.0"
textwrap = "0.16.2"
unicode-width = "0.2.1"
clap = { version = "4.5.60", features = ["derive"] }
base64 = "0.22.1"
# Only profile pictures are decoded; the default feature set pulls in a large
# (and partly unmaintained) image parsing surface we never exercise.
image = { version = "0.25.9", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# NOTE: do not set `panic = "abort"` -- it would bypass the panic hook that
# restores the terminal out of raw/alternate-screen mode.

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
